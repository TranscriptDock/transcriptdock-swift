name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: python3 .ci/check.py
      - name: Build the library for every Apple platform
        run: |
          for platform in iOS tvOS watchOS visionOS; do
            xcodebuild build -quiet -scheme TranscriptDock -destination "generic/platform=$platform" CODE_SIGNING_ALLOWED=NO
          done
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.1.3-jammy@sha256:25982986f6452a3ec404bd5544492b8c35e9f5a48be0abcbcf381adb4f77750f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure Python 3 for the fixture
        run: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: python3 .ci/check.py
